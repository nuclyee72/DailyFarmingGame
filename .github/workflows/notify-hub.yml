name: Notify hub

# 농장 코드는 허브(ProjectDaily) 사이트에 들어간다 — main에 push하면 허브 배포를 바로 실행한다.
# 다른 레포의 워크플로를 실행하려면 PAT가 필요하다: 시크릿 HUB_DEPLOY_TOKEN
# (fine-grained, 저장소 nuclyee72/ProjectDaily 하나, 권한 Actions: Read and write)
# 시크릿이 없으면 건너뛴다 — 허브는 6시간마다 서브모듈을 main 최신으로 받아 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  notify-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ProjectDaily deploy
        env:
          GH_TOKEN: ${{ secrets.HUB_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HUB_DEPLOY_TOKEN 시크릿이 없어 허브 재배포를 건너뜀 (허브는 6시간마다 자동 배포)"
            exit 0
          fi
          gh workflow run pages.yml -R nuclyee72/ProjectDaily
